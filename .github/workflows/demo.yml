# ============================================================
# demo.yml — 构建并发布仓库自带的 exampleSite 演示站
# ============================================================
#
# 这个 workflow 做两件事：
#   1. 任何 push / PR 都会构建 exampleSite，并把产物作为 artifact 上传，
#      方便在没配 Cloudflare 凭据的 fork 上先看渲染结果；
#   2. 只有配了 Secrets 时才真正发布到 Cloudflare Pages。
#
# 需要配置（Settings → Secrets and variables → Actions）：
#   CF_API_TOKEN    Cloudflare API Token（需要 Cloudflare Pages:Edit 权限）
#   CF_ACCOUNT_ID   Cloudflare 账户 ID
#   可选 Variables：
#   CF_PAGES_PROJECT  Pages 项目名，默认 zero-theme-demo

# 只想零配置部署：在 Cloudflare Pages 直接连这个仓库，
# 构建命令 hugo --minify、输出目录 exampleSite/public、HUGO_VERSION 用 extended 版本即可，
# 不需要本 workflow，仓库里也没有 wrangler.toml。

name: Deploy demo site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # hugo-bin 会把对应版本的 Hugo 二进制装进 node_modules，CI 里无需预装 Hugo
      - name: Install dependencies
        run: npm ci

      # 主题产物 zero-comment.js 由 zero-stack 构建；仓库里已带最新一份，
      # 只有想强制同步本地 dist 时才需要额外传路径。
      - name: Build exampleSite
        run: npm run build

      # 产物体检：搜索数据必须是字符串、样式必须内联、前端锚点不能被改名。
      # 这三类错误构建全绿但线上功能坏掉（归档搜索被一个不带引号的 1984 标签打死过），
      # 所以挡在 CI 里，判据见 scripts/check-build.mjs。
      - name: Check built site
        run: npm run check:build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: exampleSite/public
          retention-days: 7

      - name: Detect Cloudflare credentials
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CF_API_TOKEN / CF_ACCOUNT_ID，跳过发布（仅构建）"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy exampleSite/public --project-name=${{ vars.CF_PAGES_PROJECT || 'zero-theme-demo' }}
