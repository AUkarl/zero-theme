# ============================================================
# data/authors.yaml — 作者资料表（示例）
# 键 = 文章 front matter 里 author 写的作者标识，也是 /author/<标识>/ 的地址。
# 多作者：front matter 写成列表，例如 author: ["zero-author", "guest-author"]。
# 后台「我的信息 → 站长作者资料」保存时，会把站长那一条写进这里，
# 并把 data/site.json 的 defaultAuthor 指到同一个标识。
# ============================================================

zero-author:
  name: "Zero Author"
  avatar: "/img/avatar.svg"
  bio_zh: "这个演示站的作者，占位用的身份"
  website: "https://example.com/"
  verified: true
  social:
    - name: "GitHub"
      url: "https://github.com/AUkarl/zero-theme"
      icon: "fab fa-github"

guest-author:
  name: "客座作者"
  avatar: "/img/author.svg"
  bio_zh: "偶尔来写两篇的朋友（示例）"
  verified: false
