# 友链页的数据文件（hugo.Data.links）：friends = 左邻右舍，alliance = 站点联盟。
#
# 这份文件是后台「友链」同步出来的产物，不要手写：每次增删改都会整份重写，手加的条目下一回就没了。
# 前台那一栏的取数口径也不完全在这里 —— 「左邻右舍」只认 GET /api/friends 返回的 friends[]
# （D1 里的那份），写在这下面的 friends 根本不会显示；只有 alliance 会被主题额外并进列表，
# 于是手写的联盟条目变成「前台看得见、后台管不了、下次同步又被抹掉」的三不管数据。
# 要加站点联盟，请到后台「友链 → 站点联盟」录入，同步后这里自然会写上。
friends: []

alliance: []
