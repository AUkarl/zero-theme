  desc_zh = "示例站点的简介文字。"


  # 个性签名（显示在名称下方）
  tagline_zh = "示例个性签名。"

  # --- 个人简介内容 ---
  # 增减方法: 复制一个 [[about.bio]] 块并修改内容（支持无限段落）
