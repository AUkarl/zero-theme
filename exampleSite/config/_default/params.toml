# 11. 关于页面（/about/）
# --------------------------------------------
# 控制关于页的各区域显示开关和内容编辑。

[about]
  enable = true                    # 是否启用关于页面
  show_avatar = true               # 是否显示头像
  show_name = true                 # 是否显示名称
  show_bio = true                  # 是否显示个人简介
  show_social = true               # 是否显示社交链接
  show_friends = true               # 是否显示友情链接
  show_declaration = true           # 是否显示站点声明
  show_supports = false             # 是否显示支持服务
  show_alliance = false             # 是否显示站点联盟
  show_site = true                 # 是否显示关于本站

  # 关于页描述（显示在页面标题下方）
