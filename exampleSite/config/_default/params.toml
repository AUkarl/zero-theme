  icon = "fa-brands fa-github"
[[supports]]
  name = "Cloudflare"
  url = "https://cloudflare.com"
  icon = "fas fa-cloud"


# --------------------------------------------
# 12. 账号页面（/account/）
# --------------------------------------------
# 登录 / 注册 / 邮箱验证码 / 订阅全部由 zero-api 提供，地址只读 [zero] 里的 apiBaseURL，
# 这里没有需要配置的项。是否开放注册、要不要邀请码，在 zero-cms 后台改 allowRegister
# 与 requireInviteCode，站点无需重新构建。

# --------------------------------------------
# 13. 工坊页面（/work/）
# --------------------------------------------
# 工坊项目列表配置。

[work]
  enable = true                     # 是否启用工坊页面

  # 工坊页描述文字（显示在页面标题下方）
  show_desc = true                  # 是否显示工坊页描述
  desc_zh = "这里放一些我在做的东西。"


# --- 工坊项目列表 ---
# 增减方法: 复制一个 [[works]] 块并修改内容
# url 字段: 填写项目链接（外部 URL 或站内路径），留空则无链接

[[works]]
  i18nKey = "work-item1"
  titleZh = "Hugo 主题"
  descZh = "为 Hugo 静态站点设计的极简主题"
  statusZh = "已发布"
  url = "https://gohugo.io"
[[works]]
  i18nKey = "work-item2"
  titleZh = "示例项目二"
  descZh = "一个示例项目描述"
  statusZh = "进行中"
  url = "https://example.com"
[[works]]
  i18nKey = "work-item3"
  titleZh = "示例项目三"
  descZh = "另一个示例项目描述"
  statusZh = "已发布"
  url = "https://example.com"


# --------------------------------------------
# 14. RSS
# --------------------------------------------

[rss]
  enable = true                     # 是否启用 RSS 订阅


# --------------------------------------------
# 15. SEO
# --------------------------------------------
# 搜索引擎优化配置，控制 meta 标签和结构化数据。

[seo]
  default_description = "一个使用 zero 主题搭建的示例站点。"  # 默认描述（用于无 description 的页面）
  default_keywords = ["博客", "设计", "技术", "极简", "Hugo", "主题"]  # 默认关键词
  enable_og = true                  # 是否输出 Open Graph 标签
  enable_twitter = true             # 是否输出 Twitter Card 标签
  site_author = "示例作者"          # 站点作者（用于 meta author 标签）


# --------------------------------------------
# 16. 自定义扩展
# --------------------------------------------
# 注入自定义 HTML/CSS/JS，用于高级定制。

[custom]
  head_html = ""                    # 注入到 <head> 的 HTML（如自定义 meta、link）
  footer_html = ""                  # 注入到 </body> 前的 HTML（如自定义 script）
  extra_css = []                    # 额外 CSS 文件路径列表（如 ["/css/custom.css"]）
  extra_js = []                     # 额外 JS 文件路径列表（如 ["/js/custom.js"]）


# --------------------------------------------
# 17. 文章作者栏
# --------------------------------------------
# 文章详情页作者信息框的配置。
# 优先级: author_profile > data/authors.yaml > 全局参数
# 多作者信息请在 data/authors.yaml 中配置（本处为默认/备用值）。

[author_profile]
  avatar = "img/avatar.png"         # 默认作者头像路径
  nickname = "示例作者"             # 作者昵称
  bio_zh = "这里是示例作者简介。"  # 中文简介
  show_cc_license = true           # 是否显示 CC 开源协议

  # 作者赞赏码（也可在 data/authors.yaml 中按作者配置）
  # 增减方法: 复制一个 [[author_profile.donate]] 块并修改内容
  [[author_profile.donate]]
    qr = "img/donate-wechat.svg"    # 二维码图片路径
    name = "赞赏"                  # 平台名称
  [[author_profile.donate]]
    qr = "img/donate-alipay.svg"
    name = "PayPal"
  
  

  # 作者联系方式（显示在作者信息框中）
  # 增减方法: 复制一个 [[author_profile.contacts]] 块并修改内容
  [[author_profile.contacts]]
    name = "GitHub"
    icon = "fab fa-github"
    url = "https://github.com/your-username"
  [[author_profile.contacts]]
    name = "Twitter"
    icon = "fab fa-twitter"
    url = "https://example.com"
  [[author_profile.contacts]]
    name = "Instagram"
    icon = "fab fa-instagram"
    url = "https://example.com"
  [[social]]
  name = "微博"
  url = "https://example.com"
  icon = "fab fa-weibo"
  [[author_profile.contacts]]
    name = "B站"
    icon = "fab fa-bilibili"
    url = "https://example.com"



