# ============================================================
# params.toml — Moonlight Minimal 主题完整配置文件
# ============================================================
#
# 本文件是主题的全部可配置项汇总。
# 所有参数均有详细注释，按编号分区，方便查找和修改。
#
# 使用方式：
#   1. 根据需要修改各项参数值
#   2. 运行 hugo server 预览效果
#
# 注意事项：
#   - 字符串值用双引号包裹，如 "hello"
#   - 布尔值直接写 true / false（不加引号）
#   - 数组用方括号，如 ["a", "b"]
#   - 空字符串 "" 表示该功能未配置/未启用
#   - 修改后需重启 hugo server 才能生效
#
# ============================================================


# --------------------------------------------
# 0. zero-stack 自建后端（评论 / 点赞 / 订阅 / 统计）
# --------------------------------------------
# zero-theme 默认使用同仓库群的 zero-api（Cloudflare Workers + D1）。
# 部署方法见 zero-stack 的 docs/DEPLOYMENT.md，deploy 后把 worker 地址填在 apiBaseURL。
# apiBaseURL 留空时：评论区显示「未配置」提示，点赞/订阅/自建统计自动不输出。

apiBaseURL = ""
zeroEnabled = true                  # false 可整体关掉自建评论/点赞/订阅/统计
commentEnabled = true               # 文章评论区总开关
likeEnabled = true                  # 文章页点赞按钮
subscribeEnabled = true             # 文章页邮箱订阅框
analyticsEnabled = true             # 自建访问统计（进入页面记一次 + 每 30 秒心跳）

# 说明：以下开关不在这里配，而在 zero-cms 后台「设置」里（存 D1 的 site_config 表）：
#   commentMaxDepth（嵌套深度）、requireReview（先审后发）、allowAnonymous（允许游客发言）、
#   starEnabled（收藏）、friendsEnabled（友链）、momentsEnabled（时刻）、siteName / author 等。
# 界面语言列表用 Hugo 原生的 [languages] 配置（见 config.toml），
# 后台的 defaultLanguage / availableLanguages 只影响邮件等后端输出。


# --------------------------------------------
# 1. 站点基本信息
# --------------------------------------------
# 控制网站 Logo、名称、作者的全局显示。

# --- Logo ---
show_logo = true                    # 是否显示 Logo（true=显示 / false=隐藏）
logo = "/img/logo-nav.png"          # Logo 图片路径（相对于 static 目录）

# --- 网站名称 ---
show_site_name = true               # 是否在导航栏显示网站名称
site_name = "示例站点"              # 网站名称（默认显示）

# --- 作者 ---
show_author = true                  # 是否显示全局作者信息
author = "示例作者"                 # 默认作者名
default_author = "default"           # 文章默认作者 ID（对应 data/authors.yaml 中的 key）

# --- 其他 ---
description = "一个使用 zero 主题搭建的示例站点。"     # 站点描述（用于 SEO）
keywords = ["blog", "hugo", "theme", "示例站点", "个人博客"]  # 站点关键词（数组）
favicon = "/img/logo-favicon.png"   # 网站图标路径（相对于 static 目录，留空使用默认）

# --- 关于页 / 时刻页 / 作者栏共用的头像与昵称 ---
# 注意：这两个键必须写在所有 [表] 之前（TOML 规则：出现表头后，裸键都会归到那张表里），
# 否则会被并进 [[about.declaration]] 变成无效配置，主题就退回它自带的默认值。
aboutAvatar = "img/avatar.png"   # 头像路径（相对于 static 目录）
aboutName = "示例作者"            # 显示名称


# --------------------------------------------
# 2. 导航栏
# --------------------------------------------
# 控制导航栏的显示行为与主题切换。
# 导航菜单项在 menus.toml 中配置。

enable_theme_switch = true          # 是否显示主题切换按钮（暗色/亮色/跟随系统）

# 当主题切换关闭时，选择默认主题模式
# 可选值: "auto"（跟随系统）/ "light"（亮色）/ "dark"（暗色）
# 仅当 enable_theme_switch = false 时生效
default_theme = "auto"

# 导航栏显示名（留空则使用 site_name）
navName = "示例站点"


# --------------------------------------------
# 3. 首页 index 跳转页（/）
# --------------------------------------------
# 访问根路径时显示的诗词轮播页。

[landing]
  # --- 诗词轮播 ---
  show_quotes = true                # 是否显示诗词轮播
  quotes = [
    "海上生明月 & 天涯共此时",
    "碧山幽人来 & 清酒酌满杯",
    "江南无所有 & 聊赠一枝春",
    "今夕复何夕 & 共此灯烛光",
    "相逢且同乐 & 何必旧相知",
    "不辞山路远 & 踏雪也相过"
  ]

  # --- 欢迎语 ---
  show_welcome = true               # 是否显示欢迎语
  welcome = "Hey，好久不见"          # 问候语

  # --- 背景图片 ---
  show_background = true            # 是否显示背景图片
  background_image = "img/bj.png"  # 背景图片路径（相对于 static 目录）


# --------------------------------------------
# 4. 主页 home（/home/）
# --------------------------------------------
# 文章卡片列表页的显示配置。

[home]
  layout = "bento"                # 主页布局：bento = 新版；grid = 旧版卡片网格
  paginate = 20                     # 每页最多显示文章数量
  columns = 4                       # 卡片列数（1-4）
  stagger_offset = 22               # 第 2、4 列整体下移 = 卡片宽度的百分比（随屏幕等比缩放；0 = 不错落）
  image_ratio = "4 / 3"             # 封面图统一比例，写成 "宽 / 高"（4 / 3、1 / 1、16 / 9）
  title_lines = 2                   # 标题固定行数（超出显示省略号）
  width_ratio = 90                  # 内容区域宽度占比（1-100，100=全宽）
  mainSections = ["posts"]
  show_images = true                # 是否显示文章封面图
  show_summary = true               # 是否显示文章摘要
  summary_length = 120              # 摘要最大字数

  # 主页描述文字（显示在页面标题下方）
  show_desc = true                  # 是否显示主页描述
  desc_zh = "这里是示例站点的首页说明。"



# --------------------------------------------
# 5. 文章详情页
# --------------------------------------------
# 控制文章正文页面的显示元素。

[article]
  show_toc = true                   # 是否显示目录（Table of Contents）
  toc_levels = ["h2", "h3"]        # 目录包含的标题层级
  show_word_count = true            # 是否显示字数统计
  show_author_box = true            # 是否显示作者信息框
  show_license = true               # 是否显示 CC 许可协议
  donate_max_qr = 3                 # 赞赏弹窗最多显示二维码数量


# --------------------------------------------
# 5b. 数学公式
# --------------------------------------------

math = true                         # 是否全局启用数学公式（KaTeX）


# --------------------------------------------
# 6. 归档页（/archive/）
# --------------------------------------------

[archive]
  group_by_year = true              # 是否按年份分组
  enable_tag_danmaku = true         # 是否启用弹幕标签云
  danmaku_lanes = 5                 # 弹幕轨道数

  # 归档页描述文字（显示在页面标题下方）
  show_desc = true                  # 是否显示归档页描述
  desc_zh = "所有文章按时间线归档。"



# --------------------------------------------
# 7. 时刻页（/moments/）
# --------------------------------------------
# 只有一种形态：朋友圈式说说卡片。
#   · 内容文件（content/<语言>/moments/*.md）渲染成卡片
#   · 后台（zero-cms）发布的时刻在运行期并进同一条时间线，按时间倒序
#   · 每条卡片都能点赞 + 评论，评论走 comment_provider 选的那一家
# 想同时用后台时刻请把 apiBaseURL 填上并把 comment_provider 改成 zero。

[moment]
  comment_provider = "waline"        # 留空=禁用评论, 或选: zero / waline / twikoo / artalk
  paginate = 10                      # 每次加载的时刻数量（无限滚动）

  # Waline — 基于 Leancloud 的评论系统
  # 文档: https://waline.js.org/
  waline_server_url = "https://waline.example.com"
  waline_emoji = ["https://cdn.jsdelivr.net/npm/@waline/emojis/weibo"]

  # Twikoo — 基于云开发的评论系统
  # 文档: https://twikoo.js.org/
  twikoo_env_id = "https://twikoo.example.com"
  twikoo_region = "ap-east-1"

  # Artalk — 自托管评论系统（该系统未测试）
  # 文档: https://artalk.js.org/
  artalk_server = ""                # Artalk 服务端 URL（选 artalk 时必填）
  artalk_site = "default"           # 站点名称

  # 顶部横幅
  [moment.banner]
    show_background = true          # 是否显示背景图
    background_image = "img/bj2.png" # 背景图路径（相对于 static 目录）

  # 横幅里的资料（也是后台时刻卡片的署名）
  [moment.profile]
    default_nickname = "示例昵称"    # 昵称
    default_avatar = "img/avatar.png" # 头像路径
    show_avatar = true              # 是否显示头像
    show_nickname = true            # 是否显示昵称
    show_signature = true           # 是否显示签名
    signature = "记录生活，分享感悟"  # 签名文字


# --------------------------------------------
# 8. 评论系统（文章页）
# --------------------------------------------
# provider 可选：zero（默认，zero-stack 自建）/ waline / giscus / twikoo / artalk
# 时刻页评论配置请参见上方第 7 节 [moment] 部分。
# 只需填写所选提供商的配置项，其他留空即可。

[comment]
  enable = true                     # 是否启用评论功能（总开关）

  # --- 文章页评论 ---
  [comment.article]
    provider = "zero"               # 选择: zero / waline / giscus / twikoo / artalk
    # zero 只需站点配置里填 apiBaseURL，深度/审核/匿名规则都在 zero-cms 后台设置

    # Waline — 基于 Leancloud 的评论系统
    # 文档: https://waline.js.org/
    # 部署后可获得 serverURL，格式如 https://your-app.vercel.app
    waline_server_url = "https://waline.example.com"  # Waline 服务端 URL（必填）
    waline_emoji = ["https://cdn.jsdelivr.net/npm/@waline/emojis/weibo"]  # 表情包 CDN
    waline_visitor = true           # 是否启用访问量统计
    waline_comment_sorting = "latest"  # 评论排序: latest / oldest / hottest
    waline_pageview = true          # 是否启用浏览量统计

    # Giscus — 基于 GitHub Discussions 的评论系统
    # 配置工具: https://giscus.app/ （可视化获取以下所有 ID）
    giscus_repo = "your-username/your-repo"          # GitHub 仓库（格式: user/repo，需启用 Discussions）
    giscus_repo_id = "R_kgDOXXXXXXXX"                # 仓库 ID（从 giscus.app 获取）
    giscus_category = "Announcements"                 # Discussion 分类名
    giscus_category_id = "DIC_kwDOXXXXXXXXXXXX"       # 分类 ID（从 giscus.app 获取）
    giscus_mapping = "pathname"       # 页面映射方式: pathname / url / title / og:title
    giscus_label = "comment"          # Issue 标签

    # Twikoo — 基于云开发的评论系统
    # 文档: https://twikoo.js.org/
    # 在腾讯云开发控制台创建环境后获得 envId
    twikoo_env_id = "https://twikoo.example.com"                # 环境 ID（必填）
    twikoo_region = "ap-east-1"                # 区域（如 ap-shanghai / ap-guangzhou）

    # Artalk — 自托管评论系统
    # 文档: https://artalk.js.org/
    # 部署后获得服务端 URL
    artalk_server = ""                # Artalk 服务端 URL（必填，如 https://artalk.example.com）
    artalk_site = "default"           # 站点名称（在 Artalk 后台创建）


# （原先这一节是 Google / 百度统计的开关与站点 ID，主题已不再内置第三方统计。
#   自建统计的参数在主题默认 params.toml 的 [analytics] 一节里，示例站不必重写。）


# --------------------------------------------
# 10. 页脚
# --------------------------------------------
# 页脚版权信息、服务链接、社交链接。

[footer]
  copyright_text = "2025-{year} Example"  # 版权文字（{year} 自动替换为当前年份）
  icp = ""                            # ICP 备案号（留空则不显示）
  # designer_text = "designed by zero"  # 页脚设计者署名；不写用默认文案，写成 "" 则整行不显示

  # powered by 行（显示在 "designed by XXX" 下方）
  show_powered_by = true              # 是否显示 powered by 行
  powered_by_text = "Powered by Hugo & zero" # 自定义文字（可改为任意内容）

  # 技术服务链接（页脚中间区域）
  # 增减方法: 复制一个 [[footer.services]] 块并修改内容
  
  [[footer.services]]
    name = "Hugo"
    icon = "fa-brands fa-hugo"
    link = "https://gohugo.io/"
  [[footer.services]]
    name = "GitHub"
    icon = "fa-brands fa-github"
    link = "https://github.com/"
  [[footer.services]]
    name = "Cloudflare"
    icon = "fa-brands fa-cloudflare"
    link = "https://cloudflare.com"
  

  # 社交链接第一行
  # 增减方法: 复制一个 [[footer.social_row1]] 块并修改内容
  [[footer.social_row1]]
    name = "Instagram"
    icon = "fa-brands fa-instagram"
    link = "https://example.com"
  [[footer.social_row1]]
    name = "Twitter"
    icon = "fa-brands fa-twitter"
    link = "https://example.com"
  [[footer.social_row1]]
    name = "GitHub"
    icon = "fa-brands fa-github"
    link = "https://github.com/your-username"
  [[footer.social_row1]]
    name = "Email"
    icon = "fa-solid fa-envelope"
    link = "mailto:example@example.com"

  # 社交链接第二行
  # 增减方法: 复制一个 [[footer.social_row2]] 块并修改内容
  [[footer.social_row2]]
    name = "微博"
    icon = "fa-brands fa-weibo"
    link = "https://example.com"
  [[footer.social_row2]]
    name = "B站"
    icon = "fa-brands fa-bilibili"
    link = "https://example.com"
  [[footer.social_row2]]
    name = "知乎"
    icon = "fa-brands fa-zhihu"
    link = "https://example.com"
  [[footer.social_row2]]
    name = "RSS"
    icon = "fa-solid fa-rss"
    link = "/index.xml"


