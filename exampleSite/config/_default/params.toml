    text_zh = "你好，这里是示例作者。"
  [[about.bio]]
    text_zh = "这是第二段示例简介，写点你愿意公开的内容即可。"
  [[about.bio]]
    text_zh = "这里支持简单的 Markdown 写法，段落数量随意增减。"

  # --- 关于本站内容 ---
  # 增减方法: 复制一个 [[about.site]] 块并修改内容（支持无限段落）
  [[about.site]]
    text_zh = "这是一个示例站点。"
  [[about.site]]
    text_zh = "这一段用来介绍站点本身：为什么建、写些什么、多久更新一次。"
  [[about.site]]
    text_zh = "本站使用开源的 Hugo 主题 `zero` 搭建，可自由替换为任何主题。"

