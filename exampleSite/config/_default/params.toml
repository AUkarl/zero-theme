# --------------------------------------------
# 新版主页（[home] layout = "bento" 时生效）
# --------------------------------------------
# 布局切换：layout = "bento"（精选 Bento + 全部文章等高网格）
#           layout = "grid" （旧的卡片网格布局）
# 详见站点仓库 README「主页卡片布局」一节。
[home.bento]
  width_ratio = 90                  # 内容区宽度占比（%），默认 90
  max_width = 0                     # 可选像素上限：0 = 不限制
  intro_eyebrow = ""                # 顶部小字标签（留空不显示）
  intro_title = ""                  # 主标题（留空不显示）
  intro_desc = ""                   # 简介（留空不显示）
  featured_title = ""               # 精选区标题，留空用 i18n 默认
  featured_sub = ""                 # 精选区 slogan
  featured_mode = "auto"            # auto = 按浏览量/评论数自动选；manual = 用 featured 槽位
  featured_auto_count = 11          # auto 模式取前几篇
  featured_auto_badge = ""          # auto 模式第一张卡的角标
  articles_title = ""               # 全部文章区标题，留空用 i18n 默认
  articles_link_text = ""           # 「全部 →」文案
  initial_rows = 3                  # 初始显示行数
  load_rows = 5                     # 每次「加载更多」加载行数
  show_views = false                # 卡片上是否显示浏览量
  default_image = ""                # 封面缺失/加载失败时的兜底图（留空则显示莫兰迪渐变底）
  enable_hot = true                 # 是否启用「热门」排序（需评论系统提供统计）
  stats_provider = "auto"           # auto / waline / twikoo / artalk / none
  stats_server_url = ""             # 留空 = 自动取评论配置里的地址
  stats_views_weight = 1
  stats_comments_weight = 10
  stats_comment_probe = 6           # 最多探测前几篇的评论数（避免一次发太多请求）
  stats_cache_minutes = 360         # 统计结果在浏览器缓存多少分钟（再次打开立即按热度渲染，避免闪烁）

  # 手动模式：逐槽位配置（variant 不写则按 hero→wide→dark→top→tall→… 依次套用）
  # [[home.bento.featured]]
  #   url = "/posts/example/"
  #   variant = "hero"
  #   badge = "置顶"
