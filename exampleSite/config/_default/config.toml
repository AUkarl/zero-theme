# ============================================================
# config.toml — Hugo 基础配置
# ============================================================
#
# Hugo 站点核心配置文件，控制站点 URL、标题、
# 分页、Markdown 渲染等基础行为。
#
# 文档: https://gohugo.io/getting-started/configuration/
# ============================================================

baseURL = "https://example.com/"      # 站点完整 URL（含协议，末尾带 /）
title = "示例站点"                    # 网站标题（显示在浏览器标签页）
theme = "zero"           # 使用的主题名称（对应 themes/ 下的目录名）
locale = "zh-CN"                      # 站点语言区域标识
enableRobotsTXT = true                # 是否生成 robots.txt（允许搜索引擎爬虫访问）
defaultContentLanguage = "zh"         # 默认内容语言（未指定语言时使用）
defaultContentLanguageInSubdir = false # 是否在 URL 中添加语言前缀（如 /zh/、/en/）
# 时刻与文章的时间由后台自由填写，填成将来时间也要立刻上线，
# 否则 Hugo 默认会把未来日期整页隐藏（页面凭空消失，很难查）。
enableFuture = true

# ===== 分页 =====
# 控制文章列表页的分页行为
[pagination]
  pagerSize = 20                      # 每页显示的文章数量

# ===== 内容目录 =====
# 站点只支持中文。这里把 zh 声明为唯一语言，是为了让 Hugo 把 content/zh/posts 映射成 /posts/：
# 不写这段，content/zh/ 会被当成一个叫 zh 的栏目，所有地址前面都多出一层 /zh/。
[languages]
  [languages.zh]
    label = "中文"                    # 只用于标识，前台没有语言切换
    contentDir = "content/zh"         # 内容目录（后台写文章与时刻也按这个路径）
    weight = 1

# ===== 内容分类 =====
# 定义文章的分类维度（对应 front matter 中的 categories 和 tags 字段）
[taxonomies]
  # 只声明 author：文章页顶部的署名要点进 /author/<标识>/，这一条必须有。
  # 不再声明 category / tag —— Hugo 只为声明过的分类法生成聚合页，
  # 所以这座站不会长出 /categories/ 与 /tags/；文章里的分类、标签仍照常显示为文字。
  # 想要那两个页面时，把下面两行的注释去掉即可（主题 layouts/taxonomy/ 里有现成模板）。
  author = "author"                   # 作者标识原样作为 URL 片段，生成 /author/<作者标识>/ 资料页
  # category = "categories"
  # tag = "tags"

# ===== Markdown 渲染 =====
# 控制 Markdown 解析和代码高亮的行为
[markup]
  # Goldmark 渲染器（Hugo 默认 Markdown 引擎）
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true                   # 允许 HTML 标签（如 <div>、<img>）在 Markdown 中渲染
  # 代码高亮
  [markup.highlight]
    style = "monokai"                 # 代码高亮主题（可选: monokai, dracula, github 等）
    lineNos = false                   # 是否显示行号
    guessSyntax = true                # 未指定语言时是否自动猜测语法
  # 目录（Table of Contents）
  [markup.tableOfContents]
    startLevel = 2                    # 目录起始标题层级（h2）
    endLevel = 3                      # 目录结束标题层级（h3）

# ===== Sitemap =====
# 搜索引擎站点地图配置
[sitemap]
  changefreq = "weekly"               # 页面更新频率提示（always/hourly/daily/weekly/monthly/yearly/never）
  priority = 0.5                      # 默认优先级（0.0-1.0）
  filename = "sitemap.xml"            # 输出文件名
